name: alerts

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

jobs:
  zscore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Send only when a webhook is configured
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m ah_pairs.alerts --start 2018-01-01
