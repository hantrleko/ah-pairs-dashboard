name: scan

on:
  workflow_dispatch:

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Scan the full A+H universe
        run: python -m ah_pairs.scan --all --start 2018-01-01
      - uses: actions/upload-artifact@v4
        with:
          name: ah-scan
          path: data/cache/scan
          if-no-files-found: error
