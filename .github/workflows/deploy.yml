name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 要部署的提交 SHA，默认 main 最新
        required: false
        default: ""

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.sha }}
      reason: "manual deploy"
