name: refresh-daily

on:
  schedule:
    # 17:30 北京时间，A 股和港股都已收盘。只在工作日跑。
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
      pat: ${{ steps.commit.outputs.pat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh caches and the default desk
        id: refresh
        run: python -m ah_pairs.refresh
        env:
          AH_PUBLISH_SCAN: "1"
      - name: Commit published files
        id: commit
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REPO_PAT" ]; then
            git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${GITHUB_REPOSITORY}"
          fi
          git add data/published data/desk data/scan_snapshot
          if [ -n "$REPO_PAT" ]; then
            echo "pat=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --staged --quiet; then
            echo "没有新的缓存"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "刷新每日缓存和默认规格预计算"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: refresh
    # 配置 REPO_PAT 时推送会触发 CI，由 CI 走统一发布；没有 PAT 时推送不触发 CI，这里直接发布同一提交。
    if: needs.refresh.outputs.committed == 'true' && needs.refresh.outputs.pat != 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      sha: ${{ needs.refresh.outputs.sha }}
      reason: "refresh-daily"
