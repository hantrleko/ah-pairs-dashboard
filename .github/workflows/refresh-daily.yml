name: refresh-daily

on:
  schedule:
    # 17:30 北京时间，A 股和港股都已收盘。只在工作日跑。
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh caches and the default desk
        id: refresh
        run: python -m ah_pairs.refresh
        env:
          AH_PUBLISH_SCAN: "1"
      - name: Commit published files
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REPO_PAT" ]; then
            git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${GITHUB_REPOSITORY}"
          fi
          git add data/published data/desk data/scan_snapshot
          if git diff --staged --quiet; then
            echo "没有新的缓存"
          else
            git commit -m "刷新每日缓存和默认规格预计算"
            git push
          fi
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: f6c575bf-a8da-48eb-b1ac-2e0089a9daa1
          RAILWAY_SERVICE_ID: 38f45f68-a92f-4488-9359-142ed6f26400
          RAILWAY_ENVIRONMENT_ID: c595b32b-f875-41b3-b7a6-776de904cbd4
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not set; skip deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --detach --service ah-pairs-dashboard --environment production -m "refresh-daily"
